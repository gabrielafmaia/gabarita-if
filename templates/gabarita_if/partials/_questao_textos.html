{% if object.textoapoio_set.all %}
<div class="my-4">
  {% for texto in object.textoapoio_set.all %}
  <div class="accordion mb-2">
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button
          class="accordion-button collapsed"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#collapse{{ object.id }}_{{ forloop.counter }}"
        >
          Texto de apoio
        </button>
      </h2>
      <div id="collapse{{ object.id }}_{{ forloop.counter }}" class="accordion-collapse collapse" style="height: auto; min-height: 0;">
        <div class="accordion-body" style="padding: 1rem; height: auto; min-height: 0;">
          <div class="text-justify" style="white-space: pre-wrap; height: auto; min-height: 0;">
            {{ texto.texto|safe }}
          </div>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}

<div class="questao-enunciado text-justify" style="margin-bottom: 20px; white-space: pre-wrap;">
  {{ object.enunciado|safe }}
</div>
