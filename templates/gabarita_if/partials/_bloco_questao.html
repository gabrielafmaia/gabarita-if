<div class="bloco-item border rounded-3 p-3 bg-light" data-index="{{ numero|add:'-1' }}">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="badge bg-dark text-white titulo-bloco">
      BLOCO {{ numero }}
    </span>

    <button
      type="button"
      class="btn btn-link p-0 text-decoration-none small btn-excluir-bloco"
      data-acao="remover-bloco"
    >
      Excluir bloco
    </button>
  </div>

  <div class="row g-2 mb-2">
    <div class="col-md-6">
      <label class="form-label fw-semibold small text-muted mb-1">
        Disciplina
      </label>

      <select
        class="form-select form-select-sm disciplina-select"
        name="blocos[{{ numero|add:'-1' }}][disciplina]"
      >
        <option value="">Todas</option>

        {% for disciplina in disciplinas %}
          <option value="{{ disciplina.id }}">
            {{ disciplina.nome }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label fw-semibold small text-muted mb-1">
        Assunto
      </label>

      <select
        class="form-select form-select-sm assunto-select"
        name="blocos[{{ numero|add:'-1' }}][assunto]"
      >
        <option value="">Todos</option>
      </select>
    </div>
  </div>

  <div class="d-flex align-items-center gap-2 mt-2">
    <span class="small fw-semibold text-muted">
      N.º de questões:
    </span>

    <div
      class="input-group input-group-sm qtd-group"
      style="width: 110px"
    >
      <button
        class="btn btn-outline-secondary btn-qtd-minus"
        type="button"
      >
        -
      </button>

      <input
        type="text"
        class="form-control text-center bg-white input-qtd"
        name="blocos[{{ numero|add:'-1' }}][quantidade]"
        value="10"
        readonly
      >

      <button
        class="btn btn-outline-secondary btn-qtd-plus"
        type="button"
      >
        +
      </button>
    </div>
  </div>
</div>
