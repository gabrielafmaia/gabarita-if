<div class="card-header d-flex justify-content-between" style="all: unset">
  <p class="fw-bold m-0 d-flex align-items-center">
    {{ object.fonte }} <span class="mx-2 fs-4">•</span> Código da Questão:
    <span class="codigo-questao ms-1 me-2">{{ object.codigo }}</span>
  </p>
  <div class="d-flex gap-2 align-items-center">
    <span class="badge">{{ object.disciplina }}</span>
    <span class="badge">{{ object.assunto }}</span>
    <span
      class="badge"
      style="
        {% if object.dificuldade == 'Fácil' %}background-color: var(--primary-color); border-color: var(--primary-color);
        {% elif object.dificuldade == 'Média' %}background-color: var(--warning-color); border-color: var(--warning-color);
        {% else %}background-color: var(--danger-color); border-color: var(--danger-color);{% endif %}
        color: var(--bs-white);
      ">
      Dificuldade {{ object.dificuldade }}
    </span>
  </div>
</div>
