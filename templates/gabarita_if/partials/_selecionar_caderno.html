<h5 id="modal-titulo" class="modal-title" hx-swap-oob="true">Adicionar questão a um caderno</h5>

<div class="caderno-questao-flow">
  {% if not cadernos %}
  <p class="text-muted">Você ainda não possui cadernos disponíveis.</p>
  {% else %}
  <form
    id="crud-form"
    method="post"
    action="{% url 'gabarita_if:ajax-adicionar-questao-caderno' questao.id %}"
    hx-post="{% url 'gabarita_if:ajax-adicionar-questao-caderno' questao.id %}"
    hx-target="#modal-body"
    hx-swap="innerHTML"
    hx-indicator="#crud-indicator">
    {% csrf_token %}
    <p class="form-label">Selecione os cadernos aos quais você deseja adicionar essa questão.</p>
    {% for caderno in cadernos %}
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        name="caderno_ids"
        value="{{ caderno.id }}"
        id="caderno-questao-{{ caderno.id }}"
        {% if caderno.id in cadernos_com_questao %}checked{% endif %} />
      <label class="form-check-label" for="caderno-questao-{{ caderno.id }}"> {{ caderno.nome }} </label>
    </div>
    {% endfor %}
  </form>
  {% endif %}

  <div class="pt-2 d-flex justify-content-start">
    <button
      type="button"
      class="btn btn-outline-primary"
      hx-get="{% url 'gabarita_if:ajax-criar-caderno-para-questao' questao.id %}"
      hx-target="#modal-body"
      hx-swap="innerHTML"
      data-modal-title="Criar caderno"
      hx-indicator="#crud-indicator">
      <i class="fa-solid fa-folder-plus me-1"></i> Criar novo caderno
    </button>
  </div>
</div>

<div id="div-mensagens" hx-swap-oob="outerHTML">{% include "partials/_messages.html" %}</div>
